  .badge.next{background:var(--line);color:var(--mute)}
  .subj{font-size:19px;font-weight:700;margin:4px 0 2px}
  .prof{font-size:14px;color:var(--mute);min-height:1px}
  .join{display:block;text-align:center;margin-top:12px;padding:13px;border-radius:12px;background:var(--acc);
    color:var(--accink);text-decoration:none;font-weight:700;font-size:16px}
  .nolink{margin-top:12px;font-size:13px;color:var(--mute)}
  .empty{padding:28px 16px;text-align:center;border-radius:14px;border:1px dashed var(--line);color:var(--mute)}
  .empty.fer{background:var(--warnbg);color:var(--warn);border-color:transparent;font-weight:700}
  footer{margin-top:20px;color:var(--mute);font-size:12px;text-align:center}

n:6px 0 2px"><b>Jueves 8 de abril</b></p><p style="margin:0 0 6px;color:#667085">Sin clases</p><p style="margin:6px 0 2px"><b>Viernes 9 de abril</b></p><p style="margin:0 0 6px;color:#667085">Sin clases</p><h3 style="margin:18px 0 6px">Semana 26</h3><p style="margin:6px 0 2px"><b>Lunes 12 de abril</b></p><p style="margin:0 0 4px">18:30–20:00 · Inglés</p><p style="margin:0 0 4px">20:00–21:30 · Educación Ambiental</p><p style="margin:6px 0 2px"><b>Martes 13 de abril</b></p><p style="margin:0 0 6px;color:#667085">Sin clases</p><p style="margin:6px 0 2px"><b>Miércoles 14 de abril</b></p><p style="margin:0 0 4px">18:30–20:00 · Inglés</p><p style="margin:0 0 4px">20:00–21:30 · Educación Ambiental</p><p style="margin:6px 0 2px"><b>Jueves 15 de abril</b></p><p style="margin:0 0 6px;color:#667085">Sin clases</p><p style="margin:6px 0 2px"><b>Viernes 16 de abril</b></p><p style="margin:0 0 6px;color:#667085">Sin clases</p></div></noscript>
<footer>Semana <span id="wnum"></span> de 26 · Si algo no coincide, confirma con la escuela.</footer>

<script>
/* ================= CONFIGURACIÓN: edita aquí ================= */
const MATERIAS = {
  LEY:{n:"Leyes y Reglamento",   color:"#06b6d4", prof:"", link:"https://meet.google.com/qik-mgri-jvf"},
  ATC:{n:"Atención al Cliente",  color:"#ec4899", prof:"", link:"https://meet.google.com/wzn-ufrz-qeu"},
  TEO:{n:"Teoría de la Conducción", color:"#eab308", prof:"", link:"https://meet.google.com/utq-snkp-ght"},
  COM:{n:"Computación",          color:"#10b981", prof:"", link:"https://meet.google.com/myc-qzma-guc"},
  MEC:{n:"Mecánica Básica",      color:"#a8a29e", prof:"", link:""},
  PA: {n:"Primeros Auxilios",    color:"#ef4444", prof:"", link:""},
  PSI:{n:"Psicología Aplicada C",color:"#f59e0b", prof:"", link:""},
  GEO:{n:"Geografía del Ecuador",color:"#fb923c", prof:"", link:""},
  REL:{n:"Relaciones Humanas",   color:"#b45309", prof:"", link:""},
  EDV:{n:"Educación Vial",       color:"#a3e635", prof:"", link:""},
  ING:{n:"Inglés",               color:"#818cf8", prof:"", link:""},
  EAM:{n:"Educación Ambiental",  color:"#84cc16", prof:"", link:""}
};
/* ============================================================== */

const F = "F";           // feriado
const BLOQUES = [["18:30","20:00"],["20:00","21:30"]];
const START = new Date(2026,9,19); // lunes 19-oct-2026 (semana 1)

const A = [["LEY","MEC"],["ATC","TEO"],["LEY","COM"],["ATC","TEO"],["MEC","COM"]];
const B = [["LEY","MEC"],["ATC","TEO"],["LEY","PA"],["ATC","TEO"],["MEC","PA"]];
const C = [["LEY","REL"],["PSI","GEO"],["LEY","EDV"],["PSI","GEO"],["REL","EDV"]];
const D = [["ING","REL"],["PSI","GEO"],["ING","EDV"],["PSI","GEO"],["REL","EDV"]];
const rep=(x,n)=>Array(n).fill(x);
const mod=(base,idx,val)=>{const c=base.slice();idx.forEach(i=>c[i]=val);return c;};

const SEMANAS = [
  ...rep(A,2),                                   // 1-2
  mod(A,[0,1],F),                                // 3  (2 y 3 nov feriado)
  ...rep(A,2),                                   // 4-5
  ...rep(B,4),                                   // 6-9
  mod(B,[3,4],F),                                // 10 (24-25 dic)
  mod(B,[3,4],F),                                // 11 (31 dic - 1 ene)
  [["LEY","MEC"],["ATC","TEO"],["LEY","EDV"],["PSI","GEO"],["REL","EDV"]], // 12
  ...rep(C,3),                                   // 13-15
  mod(C,[2],["ING","EDV"]),                      // 16
  mod(mod(C,[2],["ING","EDV"]),[0,1],F),         // 17 (8-9 feb carnaval)
  ...rep(D,4),                                   // 18-21
  mod(D,[2,4],null).map((d,i)=> i===2?["ING","EAM"]: i===4?["REL","EAM"]: d), // 22
  [["ING","EAM"],null,["ING","EAM"],null,F],     // 23 (26 mar feriado)
  ...rep([["ING","EAM"],null,["ING","EAM"],null,null],3) // 24-26
];

const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const key=d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();

function ahoraGye(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Guayaquil",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value;
  return {date:new Date(g("year"),g("month")-1,g("day")), min:(g("hour")%24)*60+g("minute")};
}
const hm=s=>{const [h,m]=s.split(":");return +h*60+ +m;};

let hoy=ahoraGye().date;
let sel=new Date(hoy);
if(sel<START) sel=new Date(START);

function semanaDe(d){ // índice de semana y lunes
  const dias=Math.floor((d-START)/864e5);
  const w=Math.floor(dias/7);
  return {w, lunes:addDays(START,w*7)};
}
function clamp(d){
  const fin=addDays(START,26*7-1);
  return d<START?new Date(START):d>fin?new Date(fin):d;
}
function render(){
  const {w,lunes}=semanaDe(sel);
  document.getElementById("wnum").textContent=w+1;
  const wk=document.getElementById("week"); wk.innerHTML="";
  const sw=SEMANAS[w];
  for(let i=0;i<7;i++){
    const d=addDays(lunes,i);
    const b=document.createElement("button");
    const lab=["L","M","M","J","V","S","D"][i];
    b.innerHTML=lab+"<b>"+d.getDate()+"</b>";
    if(key(d)===key(sel)) b.classList.add("sel");
    if(key(d)===key(hoy)) b.classList.add("today");
    if(i>4 || !sw[i] ) b.classList.add("off");
    b.onclick=()=>{sel=d;render();};
    wk.appendChild(b);
  }
  const dow=(sel.getDay()+6)%7;
  const cont=document.getElementById("day"); cont.innerHTML="";
  const h=document.createElement("div"); h.className="dayhead";
  h.innerHTML=DIAS[sel.getDay()]+" "+sel.getDate()+" de "+MESES[sel.getMonth()]+
    "<small>Semana "+(w+1)+(key(sel)===key(hoy)?" · hoy":"")+"</small>";
  cont.appendChild(h);
  const info = dow>4 ? null : sw[dow];
  if(info===F){
    cont.insertAdjacentHTML("beforeend",'<div class="empty fer">Feriado · no hay clases</div>');
  } else if(!info){
    cont.insertAdjacentHTML("beforeend",'<div class="empty">No hay clases este día</div>');
  } else {
    const now=ahoraGye();
    const esHoy=key(sel)===key(now.date);
    info.forEach((cod,i)=>{
      const m=MATERIAS[cod], [ini,fin]=BLOQUES[i];
      let badge="";
      if(esHoy){
        if(now.min>=hm(ini)&&now.min<hm(fin)) badge='<span class="badge">EN CURSO</span>';
        else if(now.min<hm(ini)) badge='<span class="badge next">'+(i===0||now.min>=hm(BLOQUES[0][1])?"SIGUIENTE":"MÁS TARDE")+'</span>';
      }
      const el=document.createElement("div"); el.className="card"; el.style.borderLeftColor=m.color;
      el.innerHTML='<div class="time"><span>'+ini+' – '+fin+'</span>'+badge+'</div>'+
        '<div class="subj"></div><div class="prof"></div>';
      el.querySelector(".subj").textContent=m.n;
      el.querySelector(".prof").textContent=m.prof?("Prof. "+m.prof):"";
      if(m.link){
        const a=document.createElement("a"); a.className="join"; a.href=m.link; a.target="_blank"; a.rel="noopener";
        a.textContent="Unirse a la clase (Meet)"; el.appendChild(a);
      } else {
        el.insertAdjacentHTML("beforeend",'<div class="nolink">Link de Meet aún no disponible</div>');
      }
      cont.appendChild(el);
    });
  }
}
document.getElementById("prev").onclick=()=>{sel=clamp(addDays(sel,-7));render();};
document.getElementById("next").onclick=()=>{sel=clamp(addDays(sel,7));render();};
document.getElementById("hoy").onclick=()=>{hoy=ahoraGye().date;sel=clamp(new Date(hoy));render();};
render();
setInterval(()=>{ if(key(sel)===key(ahoraGye().date)) render(); },60000);
</script>
